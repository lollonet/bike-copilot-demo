supplier: Ciclodiffusione
search:
  url_template: "https://www.ciclodiffusione.com/shop/search/{q}/"
root: "#shop_products .product_preview"
name: ".product_preview_title strong"
price: ".product_preview_price .final_price"
item_link: "a[href^='/product/']"
# placeholders for schema completeness; detail overrides with OG meta
brand: ".product_preview_title strong"
mpn: ".product_preview_description"
pagination:
  mode: query
  param: page
  limit: 1
detail:
  root: "html"
  name: "meta[property='og:title']"
  price: "meta[property='og:price:amount']"
  brand: "meta[property='og:title']"
  mpn: "[itemprop='sku']"
  in_stock: "meta[property='og:availability']"
  category: "#breadcrumb .breadcrumb li a:last-child"
  lead_time_days: ""
  dealer_code: "[itemprop='sku']"
