  - key: ciclodiffusione
    name: "Ciclodiffusione"
    type: "web"
    base_url_env: "DEALER_CICLODIFFUSIONE_BASE_URL"
    platform: "storeden"
    mapping: "providers/web-ciclodiffusione.yaml"
    policy_url: null       # es. https://www.ciclodiffusione.com/spedizioni (da confermare)
    auth:
      mode_env: "DEALER_CICLODIFFUSIONE_AUTH_MODE"
      username_env: "DEALER_CICLODIFFUSIONE_USERNAME"
      password_env: "DEALER_CICLODIFFUSIONE_PASSWORD"
      cookie_env: "DEALER_CICLODIFFUSIONE_COOKIE"
    login:
      mode: "form"
      preflight_url: "https://www.ciclodiffusione.com/login"
      url: "https://www.ciclodiffusione.com/restserver/login"
      method: "POST"
      username_field: "credential_id"
      password_field: "credential_password"
      extra_fields: {}
    seeds:
      urls:
        - "https://www.ciclodiffusione.com/shop/complex/category/-/brand/-/?&sort-order-field=title&sort-order-type=1&product-page=90&page=1"
      sitemap: null

