dealers:
  - key: rms
    name: "RMS"
    type: "web"
    base_url_env: "DEALER_RMS_BASE_URL"
    platform: "custom-spa"
    mapping: "providers/web-rms.yaml"
    policy_url: "https://b2bnew.rms.it/ciclo/it/termini-e-condizioni"
    auth:
      mode_env: "DEALER_RMS_AUTH_MODE"
      username_env: "DEALER_RMS_USERNAME"
      password_env: "DEALER_RMS_PASSWORD"
      cookie_env: "DEALER_RMS_COOKIE"
    login:
      mode: "spa"
      preflight_url: "https://b2bnew.rms.it/ciclo/it/login"
      url: "https://apib2b.rms.it/users/authenticate"
      method: "POST"
      username_field: "username"
      password_field: "password"
      encode_base64: true
      extra_fields:
        remember_me: true
    seeds:
      urls:
        # aggiornati con scripts/generate_rms_brand_seeds.py il 2025-11-15
