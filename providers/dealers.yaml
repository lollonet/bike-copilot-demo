dealers:
  - key: rms
    name: "RMS"
    type: "web"
    base_url_env: "DEALER_RMS_BASE_URL"
    platform: "custom-spa"
    mapping: null          # TODO: aggiungere providers/web-rms-b2b.yaml quando disponibile
    policy_url: null       # es. https://rms.it/it/spedizioni (da confermare)
    auth:
      mode_env: "DEALER_RMS_AUTH_MODE"
      username_env: "DEALER_RMS_USERNAME"
      password_env: "DEALER_RMS_PASSWORD"
      cookie_env: "DEALER_RMS_COOKIE"
    seeds:
      urls: []             # URL seed verranno aggiunti dopo esplorazione B2B
      sitemap: null

  - key: ciclodiffusione
    name: "Ciclodiffusione"
    type: "web"
    base_url_env: "DEALER_CICLODIFFUSIONE_BASE_URL"
    platform: "storeden"
    mapping: "providers/web-ciclodiffusione.yaml"
    policy_url: null       # es. https://www.ciclodiffusione.com/spedizioni (da confermare)
    auth:
      mode_env: "DEALER_CICLODIFFUSIONE_AUTH_MODE"
      username_env: "DEALER_CICLODIFFUSIONE_USERNAME"
      password_env: "DEALER_CICLODIFFUSIONE_PASSWORD"
      cookie_env: "DEALER_CICLODIFFUSIONE_COOKIE"
    login:
      mode: "form"
      preflight_url: "https://www.ciclodiffusione.com/login"
      url: "https://www.ciclodiffusione.com/restserver/login"
      method: "POST"
      username_field: "credential_id"
      password_field: "credential_password"
      extra_fields: {}
    seeds:
      urls:
        - "https://www.ciclodiffusione.com/shop/complex/category/-/brand/-/?&sort-order-field=title&sort-order-type=1&product-page=90&page=1"
      sitemap: null

  - key: ciclopromo
    name: "CicloPromo"
    type: "web"
    base_url_env: "DEALER_CICLOPROMO_BASE_URL"
    platform: "custom-cartzilla"
    mapping: "providers/web-ciclopromo.yaml"
    policy_url: "https://www.ciclopromo-b2b.com/?mod=cond"
    auth:
      mode_env: "DEALER_CICLOPROMO_AUTH_MODE"
      username_env: "DEALER_CICLOPROMO_USERNAME"
      password_env: "DEALER_CICLOPROMO_PASSWORD"
      cookie_env: "DEALER_CICLOPROMO_COOKIE"
    login:
      mode: "form"
      preflight_url: "https://shop.ciclopromo.com/it/home"
      url: "https://shop.ciclopromo.com/it/accesso/invia"
      method: "POST"
      username_field: "email"
      password_field: "password"
      extra_fields:
        remember: "true"
      encoding: "multipart"
    seeds:
      urls:
        - "https://shop.ciclopromo.com/it/shop?publicPrices=true"
      sitemap: null

  - key: bikeparts
    name: "Bikeparts"
    type: "web"
    base_url_env: "DEALER_BIKEPARTS_BASE_URL"
    platform: "unknown"
    mapping: null
    policy_url: null
    auth:
      mode_env: "DEALER_BIKEPARTS_AUTH_MODE"
      username_env: "DEALER_BIKEPARTS_USERNAME"
      password_env: "DEALER_BIKEPARTS_PASSWORD"
      cookie_env: "DEALER_BIKEPARTS_COOKIE"
    seeds:
      urls: []
      sitemap: null
