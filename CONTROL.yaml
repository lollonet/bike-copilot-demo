coverage:
  phase: 1            # 1: osservazione; 2: gate line; 3: gate line+branch
  target:
    line: 0.85
    branch: 0.85

complexity:
  scope: repo
  paths: ["app","scripts"]
  mccabe:
    warn: 8
    fail: 12
  cognitive:
    warn: 12
    fail: 15
  func_loc:
    warn: 25
    fail: 30

kpi:
  pn_match_precision: 0.995   # accuratezza mapping PN
  freshness_threshold_h: 24   # offerte aggiornate entro 24h
  freshness_target_ratio: 0.85
