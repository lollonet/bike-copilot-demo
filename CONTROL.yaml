initiative: demo-lite-mvp
status: in_progress
acceptance:
  - name: type-check
    cmd: "uvx basedpyright --level error app"
  - name: lint
    cmd: "uvx ruff check --fix && uvx ruff format"
  - name: tests
    cmd: "uv run pytest -q"
    coverage:
      line: ">=85%"
      branch: ">=85%"
    note: "Enable once tests land; keep placeholder now."
  - name: health-endpoint
    cmd: "uv run uvicorn app.api:app --host 127.0.0.1 --port 8000"
    verify: "curl -s http://127.0.0.1:8000/health | grep '"status"'"
gates:
  merge:
    - type-check
    - lint
    - health-endpoint
  release:
    - tests
    - coverage
status_cmd: "make status"

