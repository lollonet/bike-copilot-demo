name: PR Autocheck (Codex)

on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]

jobs:
  autocheck:
    # Run automatically on PR (skip drafts) OR when comment contains "@codex review"
    if: |
      (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@codex review'))
    
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    concurrency:
      group: codex-autocheck-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    steps:
      - name: Resolve PR head for comment trigger
        if: github.event_name == 'issue_comment'
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            core.setOutput('sha', pr.data.head.sha);

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.pr.outputs.sha || github.event.pull_request.head.sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install Dependencies
        run: uv sync

      - name: Fast CI Check (Lint/Type/Test)
        id: ci
        run: |
          make ci-fast
        continue-on-error: true

      - name: Post Summary Comment
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ steps.ci.outcome }}' === 'success' ? '✅ Passed' : '❌ Failed';
            const sha = '${{ steps.pr.outputs.sha || github.event.pull_request.head.sha }}'.slice(0,7);
            const trigger = context.eventName === 'pull_request' ? 'Push/Open' : 'Manual Trigger';
            
            const body = `### 🤖 Codex Autocheck (${trigger})\n\n` +
              `- **Commit:** ${sha}\n` +
              `- **CI-FAST Status:** ${status}\n\n` +
              `_Run 'make ci-fast' locally to debug._`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
