name: PR Autocheck (on comment)

on:
  issue_comment:
    types: [created]

jobs:
  autocheck:
    if: ${{ github.event.issue.pull_request && contains(github.event.comment.body, '@mycodex') }}
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    concurrency:
      group: codex-autocheck-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - name: Resolve PR head
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const number = context.payload.issue.number;
            const pr = await github.rest.pulls.get({owner, repo, pull_number: number});
            core.setOutput('ref', pr.data.head.ref);
            core.setOutput('sha', pr.data.head.sha);
            core.setOutput('repo_full', pr.data.head.repo.full_name);
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pr.outputs.repo_full }}
          ref: ${{ steps.pr.outputs.ref }}
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Setup uv
        uses: astral-sh/setup-uv@v3
      - name: Install deps
        run: uv sync
      - name: Lint/Format/Typecheck
        run: |
          bash scripts/status.sh --fix || true
      - name: Tests (if any)
        run: |
          if [ -d "tests" ]; then
            UV_CACHE_DIR=.uv-cache XDG_CACHE_HOME=.uv-cache PYTHONPATH=. uv run pytest -q || true
          fi
      - name: Post summary comment
        uses: actions/github-script@v7
        with:
          script: |
            const sha = `${{ steps.pr.outputs.sha }}`.slice(0,7);
            const body = [
              `Autocheck eseguito su commit ${sha}.`,
              `- Lint/format/typecheck: eseguiti (vedi log job)`,
              `- Test: eseguiti se presenti (vedi log job)`
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body
            });
