name: Claude PR Code Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude-review:
    runs-on: ubuntu-latest
    # Skip draft PRs and PRs with skip label
    if: |
      !github.event.pull_request.draft &&
      !contains(github.event.pull_request.labels.*.name, 'skip-claude-review')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          allowed_tools: |
            Read
            Glob
            Grep
            Bash(gh pr view:*)
            Bash(gh pr diff:*)
            Bash(gh issue view:*)
            Bash(git log:*)
            Bash(git diff:*)
            Bash(git show:*)
          prompt: |
            You are a senior code reviewer. Analyze this pull request and provide a thorough review.

            ## Review Checklist

            1. **Code Quality**
               - Clean code principles (readability, maintainability)
               - DRY violations
               - Proper error handling
               - Appropriate logging

            2. **Bugs & Logic Errors**
               - Off-by-one errors
               - Null/None handling
               - Edge cases not covered
               - Race conditions

            3. **Security**
               - Input validation
               - SQL injection risks
               - Path traversal vulnerabilities
               - Credential exposure
               - SSRF risks

            4. **Performance**
               - N+1 queries
               - Memory leaks
               - Unbounded loops/queries
               - Missing pagination

            5. **Test Coverage**
               - Are new features tested?
               - Are edge cases covered?
               - Are error paths tested?

            ## Instructions

            1. First, run `gh pr diff ${{ github.event.pull_request.number }}` to see the changes
            2. Read the changed files to understand context
            3. Identify issues by severity: CRITICAL, HIGH, MEDIUM, LOW
            4. For each issue, provide:
               - File and line number
               - Description of the problem
               - Suggested fix

            ## Output Format

            Start with a summary, then list issues by severity.
            Be constructive and specific. Praise good patterns when you see them.
            If the PR looks good, say so briefly.
