name: Claude PR Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    # Skip draft PRs and PRs with skip label
    if: |
      !github.event.pull_request.draft &&
      !contains(github.event.pull_request.labels.*.name, 'skip-claude-review')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Ensure Claude OAuth secret present
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "Missing required secret CLAUDE_CODE_OAUTH_TOKEN for Claude review action."
            exit 1
          fi

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--allowed-tools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*)"'
          use_sticky_comment: true
          prompt: |
            You are a senior code reviewer. Analyze this pull request and provide a thorough review.

            ## Review Checklist

            1. **Code Quality**
               - Clean code principles (readability, maintainability)
               - DRY violations
               - Proper error handling
               - Appropriate logging

            2. **Bugs & Logic Errors**
               - Off-by-one errors
               - Null/None handling
               - Edge cases not covered
               - Race conditions

            3. **Security**
               - Input validation
               - SQL injection risks
               - Path traversal vulnerabilities
               - Credential exposure
               - SSRF risks

            4. **Performance**
               - N+1 queries
               - Memory leaks
               - Unbounded loops/queries
               - Missing pagination

            5. **Test Coverage**
               - Are new features tested?
               - Are edge cases covered?
               - Are error paths tested?

            ## Instructions

            1. First, run `gh pr diff ${{ github.event.pull_request.number }}` to see the changes
            2. Read the changed files to understand context
            3. Identify issues by severity: CRITICAL, HIGH, MEDIUM, LOW
            4. For each issue, provide:
               - File and line number
               - Description of the problem
               - Suggested fix

            ## Output Format

            Start with a summary, then list issues by severity.
            Be constructive and specific. Praise good patterns when you see them.
            If the PR looks good, say so briefly.
