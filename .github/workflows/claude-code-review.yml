name: Claude PR Code Review

on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    # Run on PR open/sync (unless skipped) OR when comment triggers it
    if: |
      (github.event_name == 'pull_request' && !github.event.pull_request.draft && !contains(github.event.pull_request.labels.*.name, 'skip-claude-review')) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '/claude-review'))

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure Claude OAuth secret present
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "Missing required secret CLAUDE_CODE_OAUTH_TOKEN for Claude review action."
            exit 1
          fi

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: "/claude-review"
          track_progress: true
          use_sticky_comment: true
          # Added make ci-fast to allowed tools
          claude_args: '--allowed-tools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(uv run ruff check:*),Bash(uv run pytest:*),Bash(make ci-fast)"'
          prompt: |
            You are a senior Python/FastAPI code reviewer for 'Bike Copilot'.

            IMPORTANT: 
            1. The project uses a "SOTA" workflow with strict SSOT documentation in docs/.
            2. Code is located in app/ (new) and app/_legacy/ (old).
            3. Use 'make ci-fast' to verify code quality.

            ## Review Checklist

            1. **Architecture Compliance**
               - Does the code follow patterns defined in docs/architecture/ARC-INDEX.md?
               - Are new requirements traced to docs/requirements/REQ-INDEX.md?

            2. **Python/FastAPI SOTA**
               - Proper async/await usage.
               - Pydantic v2 validation.
               - SQLAlchemy 2.0 (AsyncSession) patterns.
               - No mixed blocking calls.

            3. **Quality & Security**
               - Error handling using app/exceptions.py (if available) or standard exceptions.
               - No hardcoded secrets.
               - Proper Type Hints (No 'Any').

            ## Instructions
            1. Analyze changes with `gh pr diff`.
            2. Verify quality with `make ci-fast` (if feasible).
            3. Provide specific, actionable feedback grouped by Severity (CRITICAL, HIGH, MEDIUM, LOW).
            4. If the PR is excellent, just say "Approved SOTA".