name: PR Sanitize Text (fork-safe)

on:
  pull_request_target:
    types: [opened, edited, synchronize]

permissions:
  pull-requests: write
  contents: read

concurrency:
  group: pr-sanitize-target-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  sanitize:
    runs-on: ubuntu-latest
    # Extra hardening: don't run for our own internal PRs (handled by pr-sanitize)
    if: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
    steps:
      - name: Sanitize PR title/body (fork-safe)
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            if (!pr) return;
            // Skip if labeled to bypass
            const labels = (pr.labels || []).map(l => l.name);
            if (labels.includes('skip-sanitize')) {
              core.info('skip-sanitize label present; exiting.');
              return;
            }

            const origBody = pr.body || '';
            const origTitle = pr.title || '';
            let fixedBody = origBody
              .replace(/\\r\\n/g, '\n')
              .replace(/\\n/g, '\n');
            let fixedTitle = origTitle.replace(/\\n/g, ' ').replace(/\s+/g, ' ').trim();

            // Only attempt update if changes exist
            if (fixedBody === origBody && fixedTitle === origTitle) {
              core.info('PR text already clean (fork-safe)');
              return;
            }

            try {
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                title: fixedTitle,
                body: fixedBody,
              });
              core.info('Sanitized fork PR title/body successfully');
            } catch (err) {
              // If the token is read-only for some reason, don't fail the job
              core.warning(`Could not update PR text (likely fork token restriction): ${err.message}`);
            }

