name: Claude Interactive

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude-respond:
    runs-on: ubuntu-latest
    # Only run if the comment contains @claude
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude'))

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          allowed_tools: |
            Read
            Glob
            Grep
            Bash(gh pr view:*)
            Bash(gh pr diff:*)
            Bash(gh pr checks:*)
            Bash(gh issue view:*)
            Bash(gh issue list:*)
            Bash(git log:*)
            Bash(git diff:*)
            Bash(git show:*)
            Bash(git status:*)
            Bash(uv run ruff check:*)
            Bash(uv run pytest:*)
          prompt: |
            You are Claude, an AI assistant helping with this GitHub repository.

            ## Context

            A user has mentioned you with @claude. Respond helpfully to their request.

            ## Available Actions

            You can:
            - Read and analyze code files
            - Search the codebase with Glob and Grep
            - View PR diffs and details
            - View issue details
            - Run linting (ruff check) and tests (pytest) in read-only mode
            - Explain code, suggest improvements, answer questions

            You cannot:
            - Write or modify files
            - Push commits
            - Merge PRs
            - Close issues (unless explicitly allowed)

            ## Instructions

            1. Read the user's request carefully
            2. If they ask for code review, analyze the relevant files
            3. If they ask questions, search the codebase to find answers
            4. If they ask for explanations, read the code and explain clearly
            5. Be concise but thorough
            6. Format your response nicely with markdown

            ## User Request

            ${{ github.event.comment.body || github.event.issue.body }}
