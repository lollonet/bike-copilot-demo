name: Claude Interactive

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude-respond:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read

    # Only run if the comment contains @claude
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          prompt: |
            You are Claude, an AI assistant helping with this GitHub repository.

            ## Context

            A user has mentioned you with @claude. Respond helpfully to their request.

            ## Available Actions

            You can:
            - Read and analyze code files
            - Search the codebase with Glob and Grep
            - View PR diffs and details
            - View issue details
            - Run linting (ruff check) and tests (pytest) in read-only mode
            - Explain code, suggest improvements, answer questions

            You cannot:
            - Write or modify files
            - Push commits
            - Merge PRs
            - Close issues (unless explicitly allowed)

            ## Instructions

            1. Read the user's request carefully
            2. If they ask for code review, analyze the relevant files
            3. If they ask questions, search the codebase to find answers
            4. If they ask for explanations, read the code and explain clearly
            5. Be concise but thorough
            6. Format your response nicely with markdown

            ## User Request

            ${{ github.event.comment.body || github.event.issue.body }}
