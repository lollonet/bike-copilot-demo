name: Claude Interactive

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude-respond:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read

    # Only run if the comment contains @claude
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure Claude OAuth secret present
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "Missing required secret CLAUDE_CODE_OAUTH_TOKEN for Claude action."
            exit 1
          fi

      - name: Run Claude
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: "@claude"
          track_progress: true
          additional_permissions: |
            actions: read
          claude_args: '--allowed-tools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh issue view:*),Bash(git log:*),Bash(git diff:*),Bash(uv run ruff check:*),Bash(uv run pytest:*)"'
          prompt: |
            You are Claude, an AI assistant helping with this Python/FastAPI bike parts aggregation platform.

            IMPORTANT: First read .claude/CLAUDE.md for project-specific guidelines and coding standards.

            ## Context

            A user has mentioned you with @claude. Respond helpfully to their request.

            ## Project Stack
            - Python 3.12 with FastAPI
            - SQLAlchemy 2.0 (async support)
            - Pydantic for validation
            - uv for package management
            - ruff for linting, basedpyright for type checking
            - pytest for testing

            ## Available Actions

            You can:
            - Read and analyze code files
            - Search the codebase with Glob and Grep
            - View PR diffs and details with gh commands
            - View issue details
            - Run linting: `uv run ruff check app/`
            - Run tests: `uv run pytest -v tests/`
            - Explain code, suggest improvements, answer questions

            You cannot:
            - Write or modify files
            - Push commits
            - Merge PRs
            - Close issues (unless explicitly allowed)

            ## Instructions

            1. Read the user's request carefully
            2. If they ask for code review, analyze the relevant files
            3. If they ask questions, search the codebase to find answers
            4. If they ask for explanations, read the code and explain clearly
            5. Be concise but thorough
            6. Format your response nicely with markdown

            ## User Request

            ${{ github.event.comment.body || github.event.review.body || github.event.issue.body }}
