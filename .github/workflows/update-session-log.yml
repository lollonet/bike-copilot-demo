name: Auto-Update PR Log

on:
  pull_request:
    types: [closed]
    branches: [gemini-integration]

jobs:
  update-log:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gemini-integration

      - name: Append PR to Daily Log
        run: |
          mkdir -p docs/summaries/pr/
          LOG_FILE="docs/summaries/pr/$(date +%Y-%m-%d)-pr-log.md"
          if [ ! -f "$LOG_FILE" ]; then
            echo "# PR Log $(date +%Y-%m-%d)" > "$LOG_FILE"
            echo "" >> "$LOG_FILE"
          fi
          echo "- **PR #${{ github.event.pull_request.number }}**: ${{ github.event.pull_request.title }} (@${{ github.event.pull_request.user.login }})" >> "$LOG_FILE"
          echo "  - Link: ${{ github.event.pull_request.html_url }}" >> "$LOG_FILE"

      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docs/summaries/pr/
          git commit -m "AUTO: Update PR log for $(date +%Y-%m-%d)" || echo "No changes to commit"
          git push